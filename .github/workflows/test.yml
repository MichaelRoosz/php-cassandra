name: Test

on: [push, pull_request]

jobs:
  unit-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    name: Unit test - PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: bcmath, gmp, openssl, sockets
        tools: composer:v2
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Lint
      run: composer run lint

    - name: PHPStan
      run: composer run phpstan

    - name: PHPStan tests
      run: composer run phpstan:tests

    - name: Psalm
      run: composer run psalm

    - name: PHPUnit unit tests
      run: composer run test:unit

  unit-test-32bit:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.5"]

    name: Unit test (32-bit) - PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4

    # setup-php only ships 64-bit builds, so the toolchain lives in an i386
    # container (x86-64 runs i386 code natively, no emulation involved) and
    # every following step talks to it through docker exec.
    - name: Setup 32-bit PHP
      run: |
        docker run -d --name php32 --platform linux/386 \
          -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
          -w "$GITHUB_WORKSPACE" \
          -e COMPOSER_ALLOW_SUPERUSER=1 \
          i386/php:${{ matrix.php }}-cli sleep infinity
        docker exec php32 bash -euxc '
          apt-get update
          apt-get install -y --no-install-recommends $PHPIZE_DEPS git unzip libgmp-dev
          ln -sf "/usr/include/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/gmp.h" /usr/include/gmp.h
          docker-php-ext-install -j"$(nproc)" bcmath gmp sockets
          pecl install pcov
          docker-php-ext-enable pcov
          curl -sSL https://getcomposer.org/composer-stable.phar -o /usr/local/bin/composer
          chmod +x /usr/local/bin/composer
        '

    - name: Check PHP version
      run: |
        docker exec php32 php -v
        docker exec php32 php -r 'if (PHP_INT_SIZE !== 4) { fwrite(STDERR, "Expected 32-bit PHP, got PHP_INT_SIZE=" . PHP_INT_SIZE . PHP_EOL); exit(1); }'

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php32-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php32-${{ matrix.php }}-

    - name: Install dependencies
      run: docker exec php32 composer install --no-progress --prefer-dist --optimize-autoloader

    - name: PHPStan
      run: docker exec php32 composer run phpstan:32bit

    - name: Psalm
      run: docker exec php32 composer run psalm

    - name: PHPUnit unit tests
      run: docker exec php32 composer run test:unit

  integration-test:
    runs-on: ubuntu-latest

    needs: unit-test

    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        cassandra: ["4.0", "4.1", "5.0"]

    name: Integration test - PHP ${{ matrix.php }} - Cassandra ${{ matrix.cassandra }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: bcmath, gmp, openssl, sockets
        tools: composer:v2
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Check PHP version
      run: php -v

    - name: PHPUnit integration tests
      run: CASSANDRA_VERSION=${{ matrix.cassandra }} composer run test:integration

  integration-test-32bit:
    runs-on: ubuntu-latest

    needs: unit-test-32bit

    strategy:
      matrix:
        php: ["8.5"]
        cassandra: ["5.0"]

    name: Integration test (32-bit) - PHP ${{ matrix.php }} - Cassandra ${{ matrix.cassandra }}

    steps:
    - uses: actions/checkout@v4

    # setup-php only ships 64-bit builds, so the toolchain lives in an i386
    # container (x86-64 runs i386 code natively, no emulation involved) and
    # every following step talks to it through docker exec. Cassandra has no
    # 32-bit build either, so it stays a plain 64-bit container started by
    # docker compose next to it; --network host is what lets the tests reach it
    # on 127.0.0.1:9142, the address the composer scripts connect to.
    - name: Setup 32-bit PHP
      run: |
        docker run -d --name php32 --platform linux/386 --network host \
          -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
          -w "$GITHUB_WORKSPACE" \
          -e COMPOSER_ALLOW_SUPERUSER=1 \
          i386/php:${{ matrix.php }}-cli sleep infinity
        docker exec php32 bash -euxc '
          apt-get update
          apt-get install -y --no-install-recommends $PHPIZE_DEPS git unzip libgmp-dev
          ln -sf "/usr/include/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/gmp.h" /usr/include/gmp.h
          docker-php-ext-install -j"$(nproc)" bcmath gmp sockets
          pecl install pcov
          docker-php-ext-enable pcov
          curl -sSL https://getcomposer.org/composer-stable.phar -o /usr/local/bin/composer
          chmod +x /usr/local/bin/composer
        '

    - name: Check PHP version
      run: |
        docker exec php32 php -v
        docker exec php32 php -r 'if (PHP_INT_SIZE !== 4) { fwrite(STDERR, "Expected 32-bit PHP, got PHP_INT_SIZE=" . PHP_INT_SIZE . PHP_EOL); exit(1); }'

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php32-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php32-${{ matrix.php }}-

    - name: Install dependencies
      run: docker exec php32 composer install --no-progress --prefer-dist --optimize-autoloader

    # The compose lifecycle stays on the 64-bit host, so only the PHPUnit run
    # itself goes through the 32-bit container.
    - name: Start Cassandra
      run: CASSANDRA_VERSION=${{ matrix.cassandra }} docker compose up -d

    - name: Wait for Cassandra
      run: bash .docker/wait-for-cassandra.sh

    - name: PHPUnit integration tests
      run: docker exec php32 composer run test:integration:run

    - name: Stop Cassandra
      if: always()
      run: CASSANDRA_VERSION=${{ matrix.cassandra }} docker compose down -v

  integration-test-cassandra-old:
    runs-on: ubuntu-latest

    needs: unit-test

    strategy:
      matrix:
        php: ["8.5"]
        cassandra: ["3.0", "3.11"]

    name: Integration test - PHP ${{ matrix.php }} - Cassandra ${{ matrix.cassandra }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: bcmath, gmp, openssl, sockets
        tools: composer:v2
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Check PHP version
      run: php -v

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13' 

    - name: Install cqlsh
      run: pip install -U cqlsh

    - name: PHPUnit integration tests
      run: CASSANDRA_VERSION=${{ matrix.cassandra }} composer run test:integration

  integration-test-scylladb:
    runs-on: ubuntu-latest

    needs: unit-test

    strategy:
      matrix:
        php: ["8.5"]
        scylladb: ["6.2", "2025.1", "2026.1", "2026.2"]

    name: Integration test - PHP ${{ matrix.php }} - ScyllaDB ${{ matrix.scylladb }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: bcmath, gmp, openssl, sockets
        tools: composer:v2
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Check PHP version
      run: php -v

    - name: PHPUnit integration tests
      run: SCYLLADB_VERSION=${{ matrix.scylladb }} composer run test:integration_scylladb

  integration-test-auth:
    runs-on: ubuntu-latest

    needs: unit-test

    strategy:
      matrix:
        php: ["8.5"]
        cassandra: ["4.1", "5.0"]

    name: Integration test (auth) - PHP ${{ matrix.php }} - Cassandra ${{ matrix.cassandra }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: bcmath, gmp, openssl, sockets
        tools: composer:v2
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Check PHP version
      run: php -v

    - name: PHPUnit integration tests against an authenticated cluster
      run: CASSANDRA_VERSION=${{ matrix.cassandra }} composer run test:integration_auth

  php-version-compatibility:
    runs-on: ubuntu-latest

    name: PHP version compatibility test - PHP 8.1

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.1"
        extensions: bcmath, gmp, openssl, sockets, sqlite3
        tools: composer:v2

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.1-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.1-

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Create PHP Compatibility database
      run: vendor/bin/phpcompatinfo db:create

    - name: Initialize PHP Compatibility database
      run: vendor/bin/phpcompatinfo db:init

    - name: Check PHP version
      run: php -v

    - name: Ensure PHP version compatibility with PHP 8.1
      run: scripts/check-php-version.sh
