name: php-cassandra-scylladb
services:
  scylladb:
    image: scylladb/scylla:${SCYLLADB_VERSION:-2025.3}
    container_name: php-scylladb-test-db
    command:
      - --rpc-address
      - 0.0.0.0
      - --broadcast-rpc-address
      - 127.0.0.1
      - --endpoint-snitch
      - GossipingPropertyFileSnitch
      # User-defined functions/aggregates are experimental in ScyllaDB and off by
      # default. Materialized views are enabled out of the box.
      - --experimental-features=udf
      - --enable-user-defined-functions=true
    ports:
      - "9242:9042"
    healthcheck:
      test: ["CMD", "bash", "-lc", "cqlsh -e 'DESCRIBE KEYSPACES' 127.0.0.1 9042"]
      interval: 10s
      timeout: 5s
      retries: 30
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - php_scylladb_net
    volumes:
      - ./.docker/node1-rackdc.properties:/etc/scylla/cassandra-rackdc.properties:ro

networks:
  php_scylladb_net:
    driver: bridge
